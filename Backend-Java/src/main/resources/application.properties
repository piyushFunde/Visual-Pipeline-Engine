spring.application.name=demo
server.port=8081

# Database Configuration
spring.datasource.url=jdbc:h2:mem:pipelinedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update

# Default estimate latency in milliseconds by supported node type.
pipeline.estimate.base-latency-ms.customInput=5
pipeline.estimate.base-latency-ms.text=8
pipeline.estimate.base-latency-ms.llm=850
pipeline.estimate.base-latency-ms.condition=2
pipeline.estimate.base-latency-ms.customOutput=3
pipeline.estimate.base-latency-ms.timer=100
pipeline.estimate.base-latency-ms.api=250
pipeline.estimate.base-latency-ms.database=40
pipeline.estimate.base-latency-ms.webhook=120
